name: Sustained metering capacity
on:
  push:
    branches: [perf/w8a16-node-metering]
    paths:
      - 'tools/bench_metering_capacity.py'
      - 'tools/bench_w8a16_native.c'
      - 'crates/verdict-simd/**'
      - '.github/workflows/w8a16-capacity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capacity:
    strategy:
      fail-fast: false
      matrix:
        trial: [1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build benchmark canister using production kernel
        run: cargo build --locked --release --target wasm32-unknown-unknown -p verdict-simd --example metering-canister
      - name: Install measurement tools
        run: |
          python -m pip install pocket-ic==3.1.2 psutil==7.2.2 wasmtime==49.0.0
          curl --fail --location --retry 3 --output /tmp/pocketic.tar.gz https://github.com/dfinity/icp-cli-network-launcher/releases/download/v16.0.0-2026-09-18-03-28/icp-cli-network-launcher-x86_64-linux-v16.0.0-2026-09-18-03-28.tar.gz
          mkdir -p /tmp/pocketic-bin
          tar -xzf /tmp/pocketic.tar.gz -C /tmp/pocketic-bin
          sudo apt-get update -qq
          sudo apt-get install -y linux-tools-generic linux-tools-common
          sudo sysctl kernel.perf_event_paranoid=-1 || true
      - name: Build and inspect 128-bit native prototype
        run: |
          mkdir -p artifacts/capacity
          gcc -O3 -msse4.1 -mno-avx -ffp-contract=off -pthread tools/bench_w8a16_native.c -o /tmp/w8a16-native
          gcc --version > artifacts/capacity/compiler.txt
          objdump -d /tmp/w8a16-native > artifacts/capacity/native.asm
          if grep -E '\b[yz]mm[0-9]+' artifacts/capacity/native.asm; then exit 1; fi
      - name: Measure execution capacity
        env:
          POCKET_IC_MUTE_SERVER: '1'
        run: |
          export POCKET_IC_BIN="$(find /tmp/pocketic-bin -type f -name pocket-ic | head -1)"
          PERF_PATH="$(find /usr/lib/linux-tools -type f -name perf | head -1)"
          if [ -n "$PERF_PATH" ]; then
            mkdir -p /tmp/bench-bin
            ln -s "$PERF_PATH" /tmp/bench-bin/perf
            export PATH="/tmp/bench-bin:$PATH"
          fi
          python tools/bench_metering_capacity.py --wasm target/wasm32-unknown-unknown/release/examples/metering_canister.wasm --out artifacts/capacity/report.json --gemm-only --native /tmp/w8a16-native
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metering-capacity-${{ matrix.trial }}
          path: artifacts/capacity/

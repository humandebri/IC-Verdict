name: tests-and-builds
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # verify.py also builds decision-engine for wasm32; without the target that
          # check would fail here for the wrong reason.
          targets: wasm32-unknown-unknown
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      # Cargo.lock is committed. Regenerating it here first made the `--locked` checks
      # unfalsifiable, so it is no longer generated in CI.
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo run --locked -p ic-laya-core --example mock_workflow
      # Aggregate gate. A check that was requested and could not run now fails instead
      # of being recorded as NOT_RUN and reported as a pass (tools/verify.py).
      - run: python tools/verify.py --rust --require-rust
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-validation
          path: |
            Cargo.lock
            artifacts/
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: bash tools/build_one.sh decision-engine
      - run: bash tools/build_one.sh executor
      - run: bash tools/build_one.sh mock-ledger
      - run: bash tools/build_one.sh verdict-engine
      # This is a required check, not continue-on-error. Incompatibility must surface.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candid-and-wasm
          path: |
            build/
            Cargo.lock

      - group [ref=e248]:
        - generic "What the code and model do" [ref=e249] [cursor=pointer]
        - paragraph [ref=e253]: Code computes legal placements, groups identical line/holes/height outcomes, and offers up to four different outcomes by feature distance. It does not use the heuristic score to pick candidates.
        - paragraph [ref=e254]: The heuristic compares the same candidates using 10 × cleared lines − 8 × holes − height. Code converts cleared lines to a shortfall from the most lines any offered candidate clears. It describes holes, height, and this shortfall as min, mid, max, or equal; lower is better for each. In one query, the 151M model reads these descriptions and chooses a placement. The combined heuristic score is not sent to the model.
        - paragraph [ref=e255]: Comparison mode uses the same seeded piece sequence without calling the model.

[workspace]
resolver = "2"
members = ["crates/ic-laya-core", "crates/modernbert-candle", "crates/verdict-candle", "crates/verdict-simd", "crates/hf-tokenizer", "crates/canister-common", "canisters/decision-engine", "canisters/verdict-engine", "canisters/executor", "canisters/mock-ledger", "tools/verdict-upload", "tools/verdict-pack"]
default-members = ["crates/ic-laya-core"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
bincode = "1.3.3"
ic-stable-structures = "0.7.2"
candid = "0.10"
ic-cdk = "=0.20.3"
candle-core = { version = "=0.11.0", default-features = false }
safetensors = "0.8.0"
candle-nn = { version = "=0.11.0", default-features = false }
tokenizers = { version = "=0.22.0", default-features = false, features = ["fancy-regex"] }
ic-laya-core = { path = "crates/ic-laya-core" }
modernbert-candle = { path = "crates/modernbert-candle" }
verdict-candle = { path = "crates/verdict-candle" }
verdict-simd = { path = "crates/verdict-simd" }
hf-tokenizer = { path = "crates/hf-tokenizer" }
canister-common = { path = "crates/canister-common" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
# Measured: `overflow-checks = true` makes every index computation in the hot
# matmul loops (including gemm's, which is compiled with this profile) emit a
# checked multiply/add plus a panic path. See docs/VERDICT_ENGINE.md 5.1.6.
# Reverted to the default (off) for the canister profile; the wasm build still
# aborts on panic (`panic = "abort"`).
overflow-checks = false
